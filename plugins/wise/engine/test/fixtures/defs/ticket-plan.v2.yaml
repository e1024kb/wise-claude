# Hand-migrated v2 form of plugins/wise/workflows/ticket-plan/workflow.yaml (P2).
# Structure preserved: tuning groups, profiles, inputs, step ids and DAG. Prompts are
# abbreviated; the snapshot test covers the questionary, not the prose.
version: 2
name: ticket-plan
description: >-
  Tracker ticket -> pre-flight config -> parallel research -> consolidated plan ->
  optional review -> setup.
author: e1024kb

project-selection: current

preflight:
  control-mode: interactive
  worktree: current

tuning:
  groups:
    - id: evidence
      label: "Evidence & research (design spec, deep-dive sweep, codebase audit)"
      default: { harness: claude, model: opus, effort: high }
      fallback: [codex]
      options:
        - id: economy
          label: "Economy"
          description: "sonnet at medium effort"
          value: { model: sonnet, effort: medium }
    - id: authoring
      label: "Plan authoring (gap analysis, build plan, refine)"
      default: { harness: claude, model: opus, effort: xhigh }
      options:
        - id: economy
          label: "Economy"
          value: { model: claude-opus-4-8, effort: high }
    - id: presentation
      label: "Presentation and summaries"
      default: { harness: claude, model: sonnet, effort: low }
      locked: true

profiles:
  low:
    description: "sonnet evidence, Opus 4.8 authoring, one refine pass"
    tuning:
      evidence: { model: sonnet, effort: medium }
      authoring: { model: claude-opus-4-8, effort: high }
    caps: { max_refine_passes: 1 }
  medium: {}
  max:
    tuning:
      evidence: { model: opus, effort: high }
      authoring: { model: opus, effort: high }
    caps: { max_refine_passes: 3 }

inputs:
  - name: ticket_id
    prompt: "Which ticket? (paste a URL, or an id like PROJ-123 / ENG-45 / #678)"
    from-context: ticket[].ref
  - name: gap_mode
    prompt: "If the gap analysis finds open questions? (defaults | ask)"
    default: defaults
    validate: "^(defaults|ask)$"
  - name: review_mode
    prompt: "Review the plan before setup? (auto | ask)"
    default: auto
    validate: "^(auto|ask)$"
  - name: branch_mode
    prompt: "Branch handling at setup? (auto | current | ask)"
    default: auto
    validate: "^(auto|current|ask)$"
  - name: implement_mode
    prompt: "Implement the plan after setup? (plan-only | now | ask)"
    default: plan-only
    validate: "^(plan-only|now|ask)$"
  - name: config_prompt
    prompt: "Extra guidance for the run?"
    optional: true
    from-context: guidance

step-select:
  prompt: "Which research stages should run?"
  optional: [analyze-design, analyze-related, research-context, gap-analysis, resolve-gaps]

steps:
  - id: detect-context
    type: agent
    model: sonnet
    prompt: |
      Identify which tracker `{{ticket_id}}` points at, the canonical ticket ref and the
      current git branch.
    schema:
      type: object
      properties:
        tracker_slug: { type: string }
        ticket_ref: { type: string }
        current_branch: { type: string }
      required: [tracker_slug, ticket_ref, current_branch]
    outputs: [tracker_slug, ticket_ref, current_branch]
    max_turns: 4
    depends_on: []

  - id: ensure-access
    type: agent
    model: sonnet
    prompt: Confirm this session can reach the {{tracker_slug}} tracker before fetching.
    schema:
      type: object
      properties: { access: { type: string, enum: [ok, abort] } }
      required: [access]
    outputs: [access]
    depends_on: [detect-context]

  - id: fetch-ticket
    type: agent
    model: sonnet
    prompt: Fetch ticket `{{ticket_ref}}` from the {{tracker_slug}} tracker.
    depends_on: [ensure-access]

  - id: analyze-design
    type: agent
    group: evidence
    description: "Design analysis (Figma / design links)"
    prompt: As ux-designer, analyse every design link surfaced by fetch-ticket.
    depends_on: [fetch-ticket]

  - id: analyze-related
    type: agent
    model: sonnet
    description: "Related tickets & reference docs"
    prompt: Summarise every related ticket and reference doc.
    depends_on: [fetch-ticket]

  - id: research-context
    type: agent
    group: evidence
    description: "Deep-dive context sweep (grill research)"
    prompt: Run the grill research-sources routine and write the Context Dossier.
    schema:
      type: object
      properties:
        dossier_path: { type: string }
        lexicon: { type: integer }
        sources_unavailable: { type: integer }
      required: [dossier_path]
    outputs: [dossier_path]
    depends_on: [fetch-ticket]

  - id: codebase-audit
    type: agent
    group: evidence
    prompt: Run a reuse-first codebase audit against `{{project.path}}`.
    depends_on: [fetch-ticket]

  - id: gap-analysis
    type: agent
    group: authoring
    description: "Gap analysis + blueprint + gap questions"
    prompt: As architect, run the grill gap-analysis routine.
    schema:
      type: object
      properties:
        readiness: { type: string, enum: [ready, gaps] }
        open_questions: { type: integer }
      required: [readiness, open_questions]
    outputs: [readiness, open_questions]
    depends_on: [analyze-design, analyze-related, research-context, codebase-audit]
    trigger-rule: none-failed

  - id: resolve-gaps
    type: ask
    description: "Answer the gap questions inline"
    when: "readiness == 'gaps' && gap_mode == 'ask'"
    message: |
      The gap analysis found open questions (see the BLUEPRINT file under {{run.dir}}/plans/).
      Answer the ones you can; the rest proceed on their stated defaults.
    options: ["Proceed on the stated defaults"]
    allow_text: true
    output: gap_answers
    depends_on: [gap-analysis]

  - id: build-plan
    type: agent
    group: authoring
    prompt: Consolidate the research into PLAN-{{ticket_ref}}.md.
    schema:
      type: object
      properties: { plan_path: { type: string } }
      required: [plan_path]
    outputs: [plan_path]
    depends_on:
      [
        analyze-design,
        analyze-related,
        research-context,
        codebase-audit,
        gap-analysis,
        resolve-gaps,
      ]
    trigger-rule: none-failed

  - id: present-plan
    type: agent
    group: presentation
    prompt: Read the plan at `{{plan_path}}` and present it for review.
    depends_on: [build-plan]

  - id: review-comments
    type: ask
    when: "review_mode == 'ask'"
    message: Any comments or adjustments before we set up the branch?
    options: ["Accept the plan as-is"]
    allow_text: true
    output: user_comments
    depends_on: [present-plan]

  - id: refine-plan
    type: agent
    group: authoring
    when: "review_mode == 'ask' && user_comments != ''"
    prompt: Apply the user's review comments to the plan at `{{plan_path}}` (at most {{cap_max_refine_passes}} passes).
    depends_on: [review-comments]

  - id: setup
    type: agent
    model: sonnet
    prompt: Act on the branch_mode / implement_mode choices and set up the branch.
    schema:
      type: object
      properties:
        work_branch: { type: string }
        implement_choice: { type: string, enum: ["yes", "no"] }
      required: [work_branch, implement_choice]
    outputs: [work_branch, implement_choice]
    depends_on: [review-comments, refine-plan]
    trigger-rule: all-done

  - id: implement
    type: agent
    group: authoring
    when: "implement_choice == 'yes'"
    prompt: Implement the plan at `{{plan_path}}` on branch {{work_branch}}.
    depends_on: [setup]

  - id: finalize
    type: agent
    group: presentation
    prompt: Print the closing summary for {{tracker_slug}}:{{ticket_ref}}.
    depends_on: [setup, implement]
    trigger-rule: all-done

version: 2
name: api-key
description: api-key agent steps allowed by allow-api (step and tuning group); drives the low-profile rule and pricing.
tuning:
  groups:
    - id: paid
      default: { harness: claude, model: haiku }
      allow-api: true
profiles:
  low: {}
  medium: {}
steps:
  - id: priced
    type: agent
    model: haiku
    auth: api-key
    allow-api: true
    prompt: "priced: answer. JSON only."
    schema:
      type: object
      properties:
        answer: { type: string }
      required: [answer]
    outputs: [answer]
  - id: grouped
    type: agent
    group: paid
    auth: api-key
    depends_on: [priced]
    prompt: "grouped: answer. JSON only."
    schema:
      type: object
      properties:
        second: { type: string }
      required: [second]
    outputs: [second]
  - id: mystery
    type: agent
    model: mystery-model-x
    auth: api-key
    allow-api: true
    depends_on: [grouped]
    prompt: "mystery: answer. JSON only."
    schema:
      type: object
      properties:
        third: { type: string }
      required: [third]
    outputs: [third]
  - id: mystery-again
    type: agent
    model: mystery-model-x
    auth: api-key
    allow-api: true
    depends_on: [mystery]
    prompt: "mystery-again: answer. JSON only."
    schema:
      type: object
      properties:
        fourth: { type: string }
      required: [fourth]
    outputs: [fourth]

version: 2
name: single-agent
description: One schema agent step; drives timeout, missing-output, auth and resume tests.
steps:
  - id: answer
    type: agent
    model: haiku
    effort: low
    prompt: "Answer the question. Reply with JSON only."
    schema:
      type: object
      properties:
        answer: { type: string }
      required: [answer]
      additionalProperties: false
    outputs: [answer]
    max_turns: 2

version: 2
name: direct-grok
description: One agent step on grok with the harness default model; drives the real-starter test.
steps:
  - id: answer
    type: agent
    harness: grok
    model: inherit
    prompt: "Answer. Reply with JSON only."
    schema: { type: object, properties: { answer: { type: string } }, required: [answer] }
    outputs: [answer]

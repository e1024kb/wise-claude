version: 2
name: fallback
description: One agent step whose group falls back to codex; drives the E12 rate-limit test.
tuning:
  groups:
    - id: work
      default: { harness: claude, model: haiku, effort: low }
      fallback: [codex]
steps:
  - id: answer
    type: agent
    group: work
    prompt: "Answer. Reply with JSON only."
    schema: { type: object, properties: { answer: { type: string } }, required: [answer] }
    outputs: [answer]

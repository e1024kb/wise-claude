version: 2
name: fallback-missing
description: Fallback names a harness without an adapter; the step waits out the backoff instead.
steps:
  - id: answer
    type: agent
    model: haiku
    fallback: [gemini]
    prompt: "Answer. Reply with JSON only."
    schema: { type: object, properties: { answer: { type: string } }, required: [answer] }
    outputs: [answer]

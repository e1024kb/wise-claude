version: 2
name: api-key-refused
description: One api-key agent step without allow-api and one subscription step; the low profile refuses the run.
profiles:
  low: {}
  medium: {}
steps:
  - id: free
    type: agent
    model: haiku
    prompt: "free: answer. JSON only."
    schema:
      type: object
      properties:
        answer: { type: string }
      required: [answer]
    outputs: [answer]
  - id: paid
    type: agent
    model: haiku
    auth: api-key
    depends_on: [free]
    prompt: "paid: answer. JSON only."
    schema:
      type: object
      properties:
        second: { type: string }
      required: [second]
    outputs: [second]
  - id: paid-optional
    type: agent
    model: haiku
    auth: api-key
    optional: true
    depends_on: [paid]
    prompt: "paid-optional: answer. JSON only."
    schema:
      type: object
      properties:
        third: { type: string }
      required: [third]
    outputs: [third]

[project]
name = "wise-engine"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
  "mcp==2.2.0",
  "anyio==4.15.1",
  "jsonschema==4.26.0",
  "ruamel.yaml==0.19.1",
  "python-ulid==3.1.0",
  "regex==2026.9.10",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.0", "mypy==1.18.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true

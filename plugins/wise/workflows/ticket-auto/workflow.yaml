version: 2
name: ticket-auto
description: >-
  Autonomous ticket -> PR pipeline. For each ticket the engine claims a
  branch in the selected tree, plans it, implements the plan, converges it
  through a review / fix loop, pushes, opens a PR, requests the bot
  reviews, watches CI and the bots, fixes what they raise, and merges
  once the PR is green and quiet. No prompts after launch: pre-flight
  asks the per-phase harness, model and effort, and the inputs. One
  branch + PR per ticket; a merged PR loses its separate worktree and
  local branch, current-tree runs retain both. Other outcomes keep the tree
  for inspection. The push / PR / watch half runs only with a GitHub
  `origin`: with no origin each unit commits locally, with a non-GitHub
  origin it pushes but opens no PR (verdict `no-pr`), worktree kept.
author: e1024kb

project-selection: current

# The per-ticket loop is the engine's `units` step (docs/wise/
# research-ts-engine.md P4): claim, worktree, plan, implement, review
# <-> fix, push, pr, request-review, watch (fix, push, substitute
# review, merge) and cleanup run as code; the five model phases spawn
# one harness child each from the engine's prompt templates under
# engine/src/prompts/units/. This file declares only what the engine
# cannot know: the phase -> tuning-group binding, the unit caps, the
# reviewers, the intake and the report.
#
# control-mode: synchronous, no gates. worktree: current, the units step
# uses worktree_mode to select the current tree or a worktree per ticket.
preflight:
  control-mode: synchronous
  worktree: current
  # Pre-flight asks once per provider. Auto is recommended; permission floors
  # never weaken a phase that explicitly needs full-access.

# One question per group, `fix` included. Model
# tiering (opus = the latest Opus, Opus 5): opus at high for plan,
# implement, fix and the review gate; sonnet for the watch pass and support.
tuning:
  groups:
    - id: plan
      label: "Plan phase (architect, the run's decision-maker)"
      default: { harness: claude, model: opus, effort: high }
    - id: implement
      label: "Implement: executes the plan's task waves as commits (code changes, the expensive part)"
      default: { harness: claude, model: opus, effort: high }
    - id: fix
      label: "Fix pass: applies review findings, CI failures and bot review threads as commits (code changes)"
      default: { harness: claude, model: opus, effort: high }
    - id: review
      label: "Review gate: read-only 3-lens review before push (correctness, security, tests) and the substitute review when a bot is stuck"
      default: { harness: claude, model: opus, effort: high }
    - id: watch
      label: "Watch pass: polls CI and bot reviews every minute, classifies the PR state (cheap, frequent)"
      default: { harness: claude, model: sonnet, effort: medium }
    - id: support
      label: "Support: access checks and the end-of-run report (mechanical, no code changes)"
      default: { harness: claude, model: sonnet, effort: medium }

# Caps the `units` step reads (docs/wise/workflows.md, `profiles`): review
# cycles before pushing anyway, fix rounds in the watch loop, watch wall
# clock and poll, and the consecutive green passes required before
# merging. Only `medium` is applied; pre-flight picks harness, model and
# effort per tuning group from the engine's model catalog instead of a
# budget profile.
profiles:
  medium:
    caps:
      max_review_cycles: 3
      max_fix_attempts: 5
      watch_minutes: 60
      watch_poll_seconds: 60
      watch_stable_passes: 2

# `tickets` is pre-filled from the run context when the conductor
# already knows them (E1). `guidance` is the operator's standing
# instruction for the whole run; the engine hands it to every model
# phase as binding configuration (libraries to prefer, files to avoid,
# guardrails). It never turns the run into a Q&A.
inputs:
  - name: worktree_mode
    prompt: "Where should ticket branches run? (current: current tree, tickets run sequentially | new: new worktree per ticket)"
    default: new
    validate: "^(current|new)$"
  - name: tickets
    prompt: "Which tickets? Comma-separated URLs or ids (PROJ-1, PROJ-2, https://linear.app/acme/issue/ENG-9). No spaces when passed positionally."
    from-context: ticket[].ref
  - name: base_branch
    prompt: "Base branch for the ticket branches and their PRs? (the checked-out base branch first, then the default branch and recent release* branches; type another name if needed)"
    options-from: branches
  - name: guidance
    prompt: "Optional guidance for this run: skills or libraries to prefer, guidelines, files to avoid. Blank = none."
    optional: true
    from-context: guidance

steps:
  - id: preflight-checks
    type: bash
    run: |
      set -eu
      # Current-tree runs need a clean source checkout.
      if [ "{{worktree_mode}}" = current ]; then
        tree_status=$(git status --porcelain)
        if [ -n "$tree_status" ]; then
          echo "ERROR: base repo at $(pwd) has uncommitted or untracked changes; stash or commit them, then re-run." >&2
          exit 1
        fi
      fi
      # The PR half of each unit runs only against a GitHub `origin`. Classify
      # it here (host only; never echo the URL, which may embed credentials)
      # and require `gh auth` only when it is GitHub. No origin: units commit
      # locally. Non-GitHub origin: units push but open no PR. The engine
      # (wise_engine/phases/remote.py) applies the same rules for the skips.
      origin=$(git remote get-url origin 2>/dev/null || true)
      if [ -z "$origin" ]; then
        echo "REMOTE: none (no 'origin' remote); units commit locally, no push, PR or watch."
      else
        rest=${origin#*://}; rest=${rest%%/*}; rest=${rest##*@}; host=${rest%%:*}
        case "$host" in
          github.com|www.github.com|ssh.github.com|*.ghe.com) github=yes ;;
          "") github=no ;;
          *) if command -v gh >/dev/null 2>&1 && gh auth status --hostname "$host" >/dev/null 2>&1; then github=yes; else github=no; fi ;;
        esac
        if [ "$github" = yes ]; then
          gh auth status >/dev/null 2>&1 || { echo "ERROR: gh is not authenticated; run 'gh auth login'." >&2; exit 1; }
          echo "REMOTE: GitHub ($host)"
        else
          echo "REMOTE: ${host:-local path}, not GitHub; units push to origin but open no PR."
        fi
      fi
      echo "PREFLIGHT: ok"
    timeout: 30
    depends_on: []

  - id: split-tickets
    type: bash
    # Intake: the comma list becomes a JSON array the units step reads
    # as its items. Refs and URLs are validated to a JSON-safe charset
    # so no escaping is needed; the engine normalises a URL to its key.
    run: |
      set -eu
      # The value comes from the step env, never from shell source.
      raw=$(mktemp)
      trap 'rm -f "$raw"' EXIT
      printf '%s\n' "${WISE_TICKETS-}" >"$raw"
      list=$(tr ',;' '\n\n' <"$raw" | tr -d '\r' \
        | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | awk 'NF && !seen[$0]++')
      if [ -z "$list" ]; then
        echo "ERROR: no tickets given." >&2
        exit 1
      fi
      json="["
      sep=""
      while IFS= read -r item; do
        case "$item" in
          *[!A-Za-z0-9#:/._?=\&%+-]*)
            echo "ERROR: ticket ref '$item' has characters outside [A-Za-z0-9#:/._?=&%+-]." >&2
            exit 1 ;;
        esac
        json="$json$sep\"$item\""
        sep=","
      done <<EOF
      $list
      EOF
      echo "$json]"
    outputs: [ticket_list]
    timeout: 15
    depends_on: [preflight-checks]

  - id: ensure-access
    type: agent
    group: support
    prompt: |
      Confirm this run can fetch the real content of every ticket in
      `{{ticket_list}}` before any worktree or branch exists. The
      pipeline never plans from an id alone or from guesses.

      First call the `wise_context` tool with key `ticket`. A ticket
      whose entry there carries a `path` (the conductor fetched it; the
      file holds the content) or a `body` needs no probe.

      For each remaining ref, identify the tracker from the URL host or
      established run/project context: *.atlassian.net/browse/ or jira.* -> Jira;
      linear.app/*/issue/ -> Linear; github.com/*/issues/ -> GitHub
      Issues; gitlab.com/*/-/issues/ -> GitLab; app.asana.com -> Asana;
      *.monday.com, trello.com/c/, *.shortcut.com, *.notion.so,
      dev.azure.com/*/_workitems/ -> that tracker. WebSearch an unknown
      host. Do not guess a tracker from an ambiguous bare id or probe
      arbitrary trackers until one happens to return a record. If run
      context or configured project identity does not establish its
      tracker, mark access blocked. For each distinct established tracker,
      probe for a granted channel that actually returns the ticket: a CLI
      (`command -v gh`, `command -v glab`, `command -v linear`, `command
      -v jira`; e.g. `linear
      issue view <id>`), or `WebFetch` on a public URL. A login page, a
      401/403 or an empty body is not access.

      Every ticket reachable: `access` = `ok`, `detail` = one line per
      tracker and the channel that works. Any ticket unreachable:
      `access` = `blocked`, `detail` = one line per unreachable tracker
      with the tickets that need it and the fix (install and log in to its
      granted CLI, make the URL public, or have the conductor fetch the
      ticket into run context before the run), then "fix tracker access and
      re-run /wise-workflow-run ticket-auto".

      Return the fields directly, no wrapping: access, detail.
    schema:
      type: object
      properties:
        access: { type: string, enum: [ok, blocked] }
        detail: { type: string }
      required: [access, detail]
      additionalProperties: false
    outputs: [access, detail]
    allowed_tools: ["Bash(command:*)", "Bash(which:*)", "Bash(gh:*)", "Bash(glab:*)", "Bash(linear:*)", "Bash(jira:*)", "WebSearch", "WebFetch"]
    depends_on: [split-tickets]

  - id: process
    type: units
    pipeline: ticket
    items: "{{ticket_list}}"
    # Phase -> tuning group, one question each at pre-flight. The
    # engine owns the loops, the caps and the merge.
    groups: { plan: plan, implement: implement, review: review, fix: fix, watch: watch }
    caps: [max_review_cycles, max_fix_attempts, watch_minutes, watch_poll_seconds, watch_stable_passes]
    # Copilot is attached with `gh pr edit --add-reviewer`; the watch
    # pass triggers CodeRabbit by comment when the repo has it.
    reviewers: [copilot-pull-request-reviewer]
    # E8: the fixer resumes the reviewer's session inside a review cycle
    # (same harness only; otherwise the fixer starts clean).
    resume: unit
    when: "access == 'ok'"
    depends_on: [ensure-access]

  - id: report
    type: agent
    group: support
    mcp: engine-only
    prompt: |
      Write the end-of-run report for an unattended ticket-auto run
      ({{run.id}}) on {{project.name}} at {{project.path}}.

      The rows between the markers are the `units` step result, one per
      ticket, as JSON. A raw placeholder in double braces there means
      the step did not run: the run stopped at tracker access; report
      that and quote the access detail: {{detail}}

      ---
      {{units}}
      ---

      Per row: unit.ref, unit.branch, unit.worktree, unit.pr.url,
      verdict (merged | all-green | blocked | partial | exhausted |
      human-intervention | failed | skipped | no-pr), reason,
      review.converged and review.cycles, cleaned. A `no-pr` verdict
      means the project has no GitHub remote: the branch is committed
      locally (no origin) or pushed to a non-GitHub origin, and no PR
      was opened. The ledger
      {{run.dir}}/units/<branch>.json carries more per unit:
      last_phase, blueprint, plan_path, watch counters, usage.

      The run's token usage, as JSON the engine folded: `total`, `by_pool`
      (subscription, api-key), `by_harness`, `by_step`. Tokens are
      input / output / cache_read / cache_write; `cost_usd` is present
      when a child reported it or the engine priced an api-key run.

      ---
      {{usage}}
      ---

      Verify before you claim: for every row with a PR run
      `gh pr view <url> --json state,mergedAt,url` and report the live
      state; where it disagrees with the verdict say so.

      Write {{run.dir}}/report.md with: a table (ticket, branch, PR,
      verdict, reason); for each unit not merged, why and the next step
      (the BLUEPRINT path for `plan-insufficient-context`, the PR for a
      human to finish, the ledger for a failure; for `no-pr`, "branch
      <b> (local | pushed to <host>), worktree <path>: open a PR/MR
      manually or add a GitHub `origin` and resume"); the
      `git worktree remove <path>` command only for a separate worktree,
      never for `{{project.path}}`, for each unit whose
      `cleaned` is false; the run's usage totals from the JSON above and
      the token usage per unit from the ledgers.
      Print the same table and the counts in your reply. State facts
      once, no praise.

      Return the fields directly, no wrapping: merged, open, failed,
      no_pr, report_path.
    schema:
      type: object
      properties:
        merged: { type: integer }
        open: { type: integer }
        failed: { type: integer }
        no_pr: { type: integer }
        report_path: { type: string }
      required: [merged, open, failed, no_pr, report_path]
      additionalProperties: false
    outputs: [merged, open, failed, no_pr, report_path]
    allowed_tools: ["Bash(gh:*)", "Bash(git:*)", "Bash(ls:*)", "Bash(cat:*)", "Bash(mkdir:*)"]
    depends_on: [process]
    trigger-rule: all-done

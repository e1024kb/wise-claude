version: 2
name: pr-watch
description: >-
  Watch the open pull request of the checked-out branch until it is
  merged or needs a human: poll CI and any review bot the repo runs,
  review each new head locally, fix what they raise, push, and merge
  once the PR is green and quiet. Never triggers a remote review. Runs in the current checkout, never
  creates a worktree or branch. No prompts after launch. The engine
  drives the loop; pre-flight picks harness, model and effort per phase.
author: e1024kb

project-selection: current

# The loop is the engine's `units` step on the `pr` pipeline: the item
# is the checked-out branch, claim binds to its open PR, then the same
# watch / fix / push / local-review loop ticket-auto runs after its
# PR is open. /wise-pr-watch-auto conducts this workflow.
preflight:
  control-mode: synchronous
  worktree: current
  # The PR lives on the checked-out branch, so the worktree question is
  # settled: current checkout, never asked.
  lock-worktree: true

# One question per group. Labels say what each model will be doing so
# the choice can be priced: a cheap model for the watch pass, a strong
# one for the fixes and the local review.
tuning:
  groups:
    - id: fix
      label: "Fix pass: applies CI failures, bot review threads and local-review findings as commits (code changes)"
      default: { harness: claude, model: opus, effort: high }
    - id: review
      label: "Local review: the read-only 3-lens code review team (correctness, security, tests) on each new PR head"
      default: { harness: claude, model: opus, effort: high }
    - id: watch
      label: "Watch pass: polls CI and the repo's own review bots every minute, classifies the PR state, writes the findings file (cheap, frequent)"
      default: { harness: claude, model: haiku, effort: medium }
    - id: support
      label: "Support: the end-of-run report (mechanical, no code changes)"
      default: { harness: claude, model: haiku, effort: medium }

# Caps the `units` step reads: fix rounds, wall clock, poll interval and
# the consecutive green passes before merging. The `max_fix_attempts`
# and `watch_minutes` inputs override the first two when given.
profiles:
  medium:
    caps:
      max_fix_attempts: 10
      watch_minutes: 10
      watch_poll_seconds: 60
      watch_stable_passes: 2

inputs:
  - name: max_fix_attempts
    prompt: "Cap on fix rounds before standing down? Blank = 10."
    optional: true
    validate: "^([1-9][0-9]*)?$"
  - name: watch_minutes
    prompt: "How many minutes may this run watch the PR before it stops? Other takes any number from 1 to 1440."
    optional: true
    default: "10"
    suggest: ["10", "20", "45", "60"]
    validate: "^([1-9][0-9]{0,2}|1[0-3][0-9]{2}|14[0-3][0-9]|1440)?$"

steps:
  - id: resolve-branch
    type: bash
    # The checked-out branch is the unit. Protected branches, a detached
    # HEAD and a dirty checkout stop the run before any child spawns.
    run: |
      set -eu
      # `gh auth` is required only against a GitHub `origin`. Classify it here
      # (host only; never echo the URL, which may embed credentials). Without a
      # GitHub remote the engine's `pr` unit ends `skipped` (no-github-remote);
      # this step still resolves the branch so the run reaches that verdict.
      origin=$(git remote get-url origin 2>/dev/null || true)
      github=no
      if [ -n "$origin" ]; then
        rest=${origin#*://}; rest=${rest%%/*}; rest=${rest##*@}; host=${rest%%:*}
        host=$(printf '%s' "$host" | tr 'A-Z' 'a-z')
        # Resolve an SSH host alias (scp-style or ssh:// URL) to its real
        # hostname so an alias mapping to a GitHub host is classified as
        # GitHub (matches wise_engine/phases/remote.py). No connection is made;
        # known GitHub hosts need no lookup.
        case "$origin" in
          ssh://*|git+ssh://*) is_ssh=yes ;;
          *://*) is_ssh=no ;;
          *:*) is_ssh=yes ;;
          *) is_ssh=no ;;
        esac
        case "$host" in github.com|www.github.com|ssh.github.com|*.ghe.com) is_ssh=no ;; esac
        if [ "$is_ssh" = yes ] && [ -n "$host" ] && command -v ssh >/dev/null 2>&1; then
          resolved=$(ssh -G "$host" 2>/dev/null | awk 'tolower($1)=="hostname"{print $2; exit}')
          [ -n "$resolved" ] && host=$(printf '%s' "$resolved" | tr 'A-Z' 'a-z')
        fi
        case "$host" in
          github.com|www.github.com|ssh.github.com|*.ghe.com) github=yes ;;
          "") github=no ;;
          *) if command -v gh >/dev/null 2>&1 && gh auth status --hostname "$host" >/dev/null 2>&1; then github=yes; else github=no; fi ;;
        esac
      fi
      if [ "$github" = yes ]; then
        gh auth status --hostname "$host" >/dev/null 2>&1 || { echo "ERROR: gh is not authenticated for $host; run 'gh auth login'." >&2; exit 1; }
      else
        echo "REMOTE: ${host:-none}, not GitHub; the PR unit will be skipped (no-github-remote)." >&2
      fi
      branch=$(git symbolic-ref --quiet --short HEAD || true)
      if [ -z "$branch" ]; then
        echo "ERROR: detached HEAD; check out the PR branch first." >&2
        exit 1
      fi
      case "$branch" in
        main|master|release*)
          echo "ERROR: $branch is a protected branch; check out the PR branch first." >&2
          exit 1 ;;
      esac
      # The fix phase commits and pushes this checkout; unrelated local
      # changes must never ride along.
      if [ -n "$(git status --porcelain)" ]; then
        echo "ERROR: checkout at $(pwd) has uncommitted or untracked changes; stash or commit them, then re-run." >&2
        exit 1
      fi
      echo "$branch"
    outputs: [branch]
    timeout: 30
    depends_on: []

  - id: process
    type: units
    pipeline: pr
    items: "{{branch}}"
    # Phase -> tuning group. The engine owns the loop, the caps and the merge.
    groups: { watch: watch, fix: fix, review: review }
    caps: [max_fix_attempts, watch_minutes, watch_poll_seconds, watch_stable_passes]
    resume: unit
    depends_on: [resolve-branch]

  - id: report
    type: agent
    group: support
    mcp: engine-only
    prompt: |
      Write the end-of-run report for an unattended pr-watch run
      ({{run.id}}) on {{project.name}} at {{project.path}}.

      The row between the markers is the `units` step result for the
      watched branch, as JSON. A raw placeholder in double braces there
      means the step did not run; report that the run stopped before
      watching.

      ---
      {{units}}
      ---

      Fields: unit.branch, unit.pr.url, verdict (merged | all-green |
      blocked | partial | exhausted | human-intervention | failed |
      skipped), reason, review.converged and review.cycles. A `skipped`
      verdict whose reason starts with `no-github-remote` means the repo
      has no GitHub remote, so there was no PR or checks to watch. The
      ledger
      {{run.dir}}/units/<branch>.json carries the watch counters
      (passes, fix_attempts, stable), the head the local review approved
      (`watch.reviewed_sha`), what each review bot the repo runs did per
      head (`watch.verification.<provider>.<head>`: state, detail) and
      usage. Report a skipped, failed or rate-limited bot review as such,
      never as a completed review; wise never requested one.

      The run's token usage, as JSON the engine folded: `total`, `by_pool`
      (subscription, api-key), `by_harness`, `by_step`.

      ---
      {{usage}}
      ---

      Verify before you claim: run `gh pr view <url> --json
      state,mergedAt,url` and report the live state; where it disagrees
      with the verdict say so.

      Write {{run.dir}}/report.md with: the PR, the verdict and reason,
      the number of watch passes and fix rounds, what was fixed, and the
      next step for a human when the PR is not merged (the findings file
      for `blocked`, the PR for `human-intervention`, the ledger for a
      failure). Print the same in your reply. State facts once, no praise.

      Return the fields directly, no wrapping: verdict, report_path.
    schema:
      type: object
      properties:
        verdict: { type: string }
        report_path: { type: string }
      required: [verdict, report_path]
      additionalProperties: false
    outputs: [verdict, report_path]
    allowed_tools: ["Bash(gh:*)", "Bash(git:*)", "Bash(ls:*)", "Bash(cat:*)", "Bash(mkdir:*)"]
    depends_on: [process]
    trigger-rule: all-done

version: 2
name: impl-plan-auto
description: >-
  Autonomous plan-file -> PR pipeline. Give it one or more PLAN-*.md
  files (for example the plans /wise-revise writes into docs/plans/);
  for each one the engine claims a branch and worktree, re-plans the
  seed against current HEAD, implements the refreshed plan, converges
  it through a review / fix loop, pushes, opens a PR, requests the bot
  reviews, watches CI and the bots, fixes what they raise, and merges
  once the PR is green and quiet. No prompts after launch. One worktree
  + branch + PR per plan file; a merged PR loses its worktree and local
  branch, anything else stays open for a human with the worktree kept
  for inspection.
author: e1024kb

project-selection: current

# The per-plan loop is the engine's `units` step on the `plan`
# pipeline (docs/wise/research-ts-engine.md P4): the seed plan path is
# the item, the branch is the file name without PLAN- and .md, and the
# plan phase writes the refreshed plan under the run directory. The
# phases and the loops are the same as ticket-auto's; only the plan
# prompt differs (re-plan from a seed instead of from a ticket).
#
# /wise-implement-plan-auto is the implement-only building block (task
# waves + commits, no push / PR / watch); this workflow is the full
# pipeline around a plan file.
preflight:
  control-mode: synchronous
  worktree: current

# One question per group. `fix` shares the implement group. Model
# tiering (opus = the latest Opus, Opus 5): opus at high for re-plan,
# implement and the review gate; sonnet for the watch pass.
tuning:
  groups:
    - id: plan
      label: "Re-plan phase (architect, re-plans the seed at HEAD)"
      default: { harness: claude, model: opus, effort: high }
      options:
        - id: economy
          label: "Economy"
          description: "Opus 4.8 at high effort"
          value: { model: claude-opus-4-8, effort: high }
    - id: implement
      label: "Implement + fix phases (engineer executors)"
      default: { harness: claude, model: opus, effort: high }
      options:
        - id: economy
          label: "Economy"
          description: "sonnet at high effort"
          value: { model: sonnet, effort: high }
    - id: review
      label: "Review gate (3 lenses: correctness, security, tests)"
      default: { harness: claude, model: opus, effort: high }
      options:
        - id: economy
          label: "Economy"
          description: "Opus 4.8 at medium effort"
          value: { model: claude-opus-4-8, effort: medium }
    - id: watch
      label: "CI + bot-review watch pass"
      default: { harness: claude, model: sonnet, effort: medium }
      options:
        - id: economy
          label: "Economy"
          description: "sonnet at low effort"
          value: { model: sonnet, effort: low }

# Budget profiles (docs/wise/workflows.md, Profiles). `medium` = the
# declared defaults. `low` MUST never dispatch Opus 5: re-plan and
# review pin Opus 4.8, implement drops to sonnet. Caps are read by the
# `units` step; `max` adds the adversarial verification pass to every
# review.
profiles:
  low:
    description: "Opus 4.8 re-plan and review, sonnet implement, tight caps"
    tuning:
      plan: { model: claude-opus-4-8, effort: high }
      implement: { model: sonnet, effort: high }
      review: { model: claude-opus-4-8, effort: medium }
      watch: { model: sonnet, effort: low }
    caps:
      max_review_cycles: 2
      max_fix_attempts: 3
      watch_minutes: 30
      watch_poll_seconds: 60
      watch_stable_passes: 2
  medium:
    description: "opus re-plan, implement and review; sonnet watch"
    caps:
      max_review_cycles: 3
      max_fix_attempts: 5
      watch_minutes: 60
      watch_poll_seconds: 60
      watch_stable_passes: 2
  max:
    description: "opus everywhere but watch, verified reviews, widest caps"
    tuning:
      plan: { model: opus, effort: high }
      implement: { model: opus, effort: high }
      review: { model: opus, effort: high }
      watch: { model: sonnet, effort: medium }
    caps:
      max_review_cycles: 5
      max_fix_attempts: 10
      watch_minutes: 120
      watch_poll_seconds: 60
      watch_stable_passes: 2

# `guidance` is the operator's standing instruction for the whole run;
# the engine hands it to every model phase as binding configuration.
inputs:
  - name: plans
    prompt: "Which plan file(s)? Comma-separated PLAN-*.md paths (docs/plans/PLAN-api-caching.md, docs/plans/PLAN-auth-debt.md). Relative paths resolve against the repo root. No spaces when passed positionally."
  - name: guidance
    prompt: "Optional guidance for this run: skills or libraries to prefer, guidelines, files to avoid. Blank = none."
    optional: true
    from-context: guidance

steps:
  - id: preflight-checks
    type: bash
    run: |
      set -eu
      # An autonomous multi-worktree run starts from a clean base.
      if ! git diff --quiet || ! git diff --cached --quiet; then
        echo "ERROR: base repo at $(pwd) has uncommitted changes; stash or commit them, then re-run." >&2
        exit 1
      fi
      gh auth status >/dev/null 2>&1 || { echo "ERROR: gh is not authenticated; run 'gh auth login'." >&2; exit 1; }
      git remote get-url origin >/dev/null 2>&1 || { echo "ERROR: no 'origin' remote." >&2; exit 1; }
      echo "PREFLIGHT: ok"
    timeout: 30
    depends_on: []

  - id: split-plans
    type: bash
    # Intake: the comma list becomes a JSON array of absolute plan
    # paths the units step reads as its items. Every file must exist:
    # a missing seed stops the run here, before any worktree exists.
    run: |
      set -eu
      # The value lands in a temp file first: bash 3.2 (macOS) cannot
      # parse a heredoc inside $( ) when the text has an odd quote.
      raw=$(mktemp)
      trap 'rm -f "$raw"' EXIT
      cat >"$raw" <<'WISE_PLANS'
      {{plans}}
      WISE_PLANS
      list=$(tr ',;' '\n\n' <"$raw" | tr -d '\r' \
        | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | awk 'NF && !seen[$0]++')
      if [ -z "$list" ]; then
        echo "ERROR: no plan files given." >&2
        exit 1
      fi
      json="["
      sep=""
      missing=""
      while IFS= read -r item; do
        case "$item" in
          /*) path="$item" ;;
          *)  path="$(pwd)/$item" ;;
        esac
        if [ ! -f "$path" ]; then
          missing="$missing $item"
          continue
        fi
        path="$(cd "$(dirname "$path")" && pwd)/$(basename "$path")"
        case "$path" in
          *[\"\\]*|*[[:cntrl:]]*)
            echo "ERROR: plan path '$path' contains a quote, backslash or control character." >&2
            exit 1 ;;
        esac
        json="$json$sep\"$path\""
        sep=","
      done <<EOF
      $list
      EOF
      if [ -n "$missing" ]; then
        echo "ERROR: plan file(s) not found:$missing" >&2
        exit 1
      fi
      echo "$json]"
    outputs: [plan_list]
    timeout: 15
    depends_on: [preflight-checks]

  - id: process
    type: units
    pipeline: plan
    items: "{{plan_list}}"
    # Phase -> tuning group. `fix` shares the implement group. The
    # engine owns the loops, the caps and the merge.
    groups: { plan: plan, implement: implement, review: review, fix: implement, watch: watch }
    caps: [max_review_cycles, max_fix_attempts, watch_minutes, watch_poll_seconds, watch_stable_passes]
    # Copilot is attached with `gh pr edit --add-reviewer`; the watch
    # pass triggers CodeRabbit by comment when the repo has it.
    reviewers: [copilot-pull-request-reviewer]
    # E8: the fixer resumes the reviewer's session inside a review cycle.
    resume: unit
    depends_on: [split-plans]

  - id: report
    type: agent
    model: sonnet
    prompt: |
      Write the end-of-run report for an unattended impl-plan-auto run
      ({{run.id}}) on {{project.name}} at {{project.path}}.

      The rows between the markers are the `units` step result, one per
      seed plan, as JSON. A raw placeholder in double braces there
      means the step did not run; report that the run stopped before
      processing.

      ---
      {{units}}
      ---

      Per row: unit.ref, unit.branch, unit.worktree, unit.plan_path
      (the seed), unit.pr.url, verdict (merged | all-green | blocked |
      partial | exhausted | human-intervention | failed | skipped),
      reason, review.converged and review.cycles, cleaned. The ledger
      {{run.dir}}/units/<branch>.json carries more per unit:
      last_phase, blueprint, the refreshed plan_path, watch counters,
      usage.

      Verify before you claim: for every row with a PR run
      `gh pr view <url> --json state,mergedAt,url` and report the live
      state; where it disagrees with the verdict say so.

      Write {{run.dir}}/report.md with: a table (seed plan, branch, PR,
      verdict, reason); for each unit not merged, why and the next step
      (the BLUEPRINT path for `plan-insufficient-context`, the PR for a
      human to finish, the ledger for a failure); the
      `git worktree remove <path>` command for each unit whose
      `cleaned` is false; the token usage per unit from the ledgers.
      Print the same table and the counts in your reply. State facts
      once, no praise.

      Return the fields directly, no wrapping: merged, open, failed,
      report_path.
    schema:
      type: object
      properties:
        merged: { type: integer }
        open: { type: integer }
        failed: { type: integer }
        report_path: { type: string }
      required: [merged, open, failed, report_path]
      additionalProperties: false
    outputs: [merged, open, failed, report_path]
    allowed_tools: ["Bash(gh:*)", "Bash(git:*)", "Bash(ls:*)", "Bash(cat:*)", "Bash(mkdir:*)"]
    depends_on: [process]
    trigger-rule: all-done
